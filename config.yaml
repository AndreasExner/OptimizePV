name: "OptimizePV"
version: "0.8.1"
slug: "optimizepv"
description: "PV-Optimierung mit ML-basierter Ertragsprognose. Maximiert Eigenverbrauch durch intelligente Batterie- und Ladesteuerung."
url: "https://github.com/AndreasExner/OptimizePV"
arch:
  - amd64
  - aarch64
build_from:
  amd64: "ghcr.io/home-assistant/amd64-base-python:3.12-alpine3.20"
  aarch64: "ghcr.io/home-assistant/aarch64-base-python:3.12-alpine3.20"
init: false
startup: "application"
boot: "auto"
options:
  evcc_url: "http://192.168.66.20:7070"
  collector_interval: 300
  log_level: "INFO"
schema:
  evcc_url: url
  collector_interval: "int(60,3600)"
  log_level: "list(DEBUG|INFO|WARNING|ERROR)"
map:
  - type: data
    read_only: false
  - type: addon_config
    read_only: false
homeassistant_api: true
ingress: true
ingress_port: 8099
panel_icon: "mdi:solar-power-variant"
panel_title: "OptimizePV"
panel_admin: false
