# OPTIONAL: evcc Demo-Instanz für Entwicklung ohne reale evcc-Installation.
# Nicht benötigt wenn Zugriff auf eine reale evcc-Instanz besteht.
# Start: docker-compose up -d
services:
  evcc:
    image: evcc/evcc:latest
    container_name: evcc-demo
    command: ["--demo"]
    ports:
      - "7070:7070"
    restart: unless-stopped
